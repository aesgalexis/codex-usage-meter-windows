name: Bug report
description: Report a reproducible problem with Codex Usage Meter for Windows.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Describe the problem without sharing private session contents.
        Do not attach raw Codex session files, conversation logs, credentials, tokens, or personal account data.
  - type: input
    id: windows_version
    attributes:
      label: Windows version and build
      description: Find the version and OS build with winver.
      placeholder: Windows 11, version and OS build
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Codex Usage Meter version
      description: Open About from the tray menu.
      placeholder: 0.8.0
    validations:
      required: true
  - type: input
    id: codex_client
    attributes:
      label: Codex client and version
      description: Identify the Codex desktop app, CLI, or Visual Studio Code extension, and its version if known. Say if Codex is not installed.
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - WinGet
        - GitHub Windows installer
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected tray action, widget mode, or usage-bar setting. Describe any CODEX_HOME configuration without sharing personal paths.
      placeholder: |
        1. Start the app...
        2. Choose...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Explain what should happen and what happened instead. Include the visible message or affected limit (five-hour or weekly) when relevant.
    validations:
      required: true
  - type: textarea
    id: display_details
    attributes:
      label: Relevant environment or display details
      description: If relevant, include app language, display count and scale, taskbar auto-hide, and whether the problem followed an update or monitor change. Only share redacted screenshots or minimal synthetic examples, never raw session logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private conversation content, raw session files, credentials, tokens, and personal account data from this report.
          required: true
