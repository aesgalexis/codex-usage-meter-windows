name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $project = [xml](Get-Content 'src/CodexUsageMeter.App/CodexUsageMeter.App.csproj' -Raw)
          $version = $project.SelectSingleNode('//Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version: $version" }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne "v$version") {
            throw "Tag $env:RELEASE_REF_NAME does not match project version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify
        run: |
          dotnet build CodexUsageMeter.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/CodexUsageMeter.Tests/CodexUsageMeter.Tests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained app
        run: >-
          dotnet publish src/CodexUsageMeter.App/CodexUsageMeter.App.csproj
          -p:PublishProfile=win-x64
          --output artifacts/win-x64
      - name: Build Inno Setup installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $sourceDir = (Resolve-Path "artifacts/win-x64").Path
          $outputDir = (Resolve-Path "artifacts").Path
          $isccCommand = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $iscc = if ($isccCommand) { $isccCommand.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "Inno Setup compiler not found" }
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "installer/CodexUsageMeter.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test silent install, automatic update and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: >-
          ./tools/Test-Installer.ps1
          -InstallerPath artifacts/CodexUsageMeter-Setup-win-x64.exe
          -PortableExecutablePath artifacts/win-x64/CodexUsageMeter.exe
      - name: Prepare WinGet manifests
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          ./tools/New-WinGetManifest.ps1
          -Version $env:RELEASE_VERSION
          -InstallerPath artifacts/CodexUsageMeter-Setup-win-x64.exe
          -OutputDirectory artifacts/winget
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/CodexUsageMeter-win-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: CodexUsageMeter-win-x64
          path: |
            artifacts/CodexUsageMeter-win-x64.zip
            artifacts/CodexUsageMeter-Setup-win-x64.exe
            artifacts/winget/**
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/CodexUsageMeter-win-x64.zip
          artifacts/CodexUsageMeter-Setup-win-x64.exe
          --generate-notes
          --verify-tag
